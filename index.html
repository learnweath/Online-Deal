<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Online Shopping Deals 🇮🇳</title>
    <style>
        /* --- CSS Reset & Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* --- Luxury/GitHub Dark Theme Background --- */
        body {
            background-color: #0d1117; /* GitHub Dark Dimmed */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 136, 204, 0.05) 0%, transparent 20%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        /* --- Floating Particles Animation --- */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: floatUp 15s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- Glassmorphism Card --- */
        .card {
            background: rgba(22, 27, 34, 0.7); /* GitHub darker shade with opacity */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 25px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 
                        0 0 0 1px rgba(255, 215, 0, 0.1); /* Subtle Gold border */
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        /* --- Header & Logo --- */
        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
            display: inline-block;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            color: #e6edf3;
        }

        /* --- Animated Colour Full Text (Gradient) --- */
        .gradient-text {
            background: linear-gradient(
                90deg, 
                #FFD700, 
                #FF8C00, 
                #0088cc, 
                #FFD700
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 5s infinite linear;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: block;
        }

        /* --- Content List --- */
        .features {
            list-style: none;
            margin-bottom: 30px;
            text-align: left;
            padding: 0 10px;
        }

        .features li {
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: #8b949e; /* GitHub grey text */
            display: flex;
            align-items: center;
        }

        .features li span {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* --- Luxury Button Animation --- */
        .join-btn {
            position: relative;
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(45deg, #0088cc, #005f8f);
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.4);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Button Hover & Animation */
        .join-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); /* Gold Glow on hover */
            background: linear-gradient(45deg, #FFD700, #FF8C00); /* Turns Gold on hover */
            color: #000;
        }

        .join-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .join-btn:hover::before {
            left: 100%;
        }

        /* --- Keyframes --- */
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* --- Footer/Credit --- */
        .footer-note {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #8b949e;
            opacity: 0.7;
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .logo { font-size: 3rem; }
            h1 { font-size: 1.2rem; }
            .gradient-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="card" id="tiltCard">
        <div class="logo">🛍️</div>
        
        <h1>India Online Shopping Deals 🇮🇳</h1>
        
        <span class="gradient-text">
            India’s Best Online Shopping Deals Channel
        </span>

        <ul class="features">
            <li><span>🛒</span> Amazon | Flipkart | Myntra | Ajio | Meesho</li>
            <li><span>🔥</span> Daily Loot Deals, Huge Discounts & Offers</li>
            <li><span>💯</span> Verified Deals | Limited Time Offers</li>
            <li><span>👉</span> Save Money on Every Purchase</li>
        </ul>

        <a href="https://t.me/IndiaOnlineDeals24" class="join-btn">
            Join Channel Now
        </a>

        <p class="footer-note">Join 50,000+ Happy Shoppers</p>
    </div>

    <script>
        // --- JavaScript for 3D Tilt Effect & Particles ---

        // 1. Generate Particles
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            let p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 10 + 5) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            particleContainer.appendChild(p);
        }

        // 2. 3D Tilt Effect on Mouse Move
        const card = document.getElementById('tiltCard');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
        
        // Mobile Gyroscope support (Optional check)
        if(window.DeviceOrientationEvent) {
            window.addEventListener("deviceorientation", function(event) {
                const rotateY = event.gamma / 5; 
                const rotateX = event.beta / 5;
                card.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
            });
        }
    </script>
</body>
  </html>
